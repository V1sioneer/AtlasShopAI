version: '3.8'

services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/data.db
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  bot_data:
