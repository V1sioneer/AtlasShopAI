<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <title>Atlas Shop</title>
  <defs>
    <clipPath id="rounded"><rect width="320" height="320" rx="20"/></clipPath>
    <filter id="invert" x="0" y="0" width="320" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="1 0"/>
        <feFuncG type="table" tableValues="1 0"/>
        <feFuncB type="table" tableValues="1 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#rounded)">
    <image width="320" height="320" href="data:image/jpeg;base64," filter="url(#invert)"/>
  </g>
</svg>